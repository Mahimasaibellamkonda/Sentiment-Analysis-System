<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sentiment Analysis System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Sentiment Analysis System</h1>

        <p class="subtitle">
            Analyze the emotional tone of your text
        </p>

        <form method="POST">

            <label for="text">
                Enter Text
            </label>

            <textarea
                id="text"
                name="text"
                placeholder="Example: I really enjoyed this movie!"
                required>{{ text }}</textarea>

            <button type="submit">
                Analyze Sentiment
            </button>

        </form>


        {% if sentiment %}

        <div class="result">

            <h2>Analysis Result</h2>

            <div class="sentiment">
                {{ sentiment }}
            </div>

            <div class="details">

                <p>
                    <strong>Polarity:</strong>
                    {{ polarity }}
                </p>

                <p>
                    <strong>Subjectivity:</strong>
                    {{ subjectivity }}
                </p>

            </div>

        </div>

        {% endif %}

    </div>

</body>

</html>
